[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-toolkit"
version = "0.5.0"
description = "SIPL Language Toolkit: parser, AST, interpreter, trace, semantic terms, visualization"
requires-python = ">=3.10"
dependencies = ["lark>=1.1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
sipl = "sipl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
